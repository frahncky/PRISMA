name: Testes PRISMA
on:
  push:
  pull_request:
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas do Qt no Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libdbus-1-3
      - name: Instalar dependências
        run: python -m pip install -e '.[dev]'
      - name: Compilar módulos
        run: python -m compileall -q src
      - name: Testar
        run: python -m pytest -q
      - name: Validar sintaxe do diagnóstico Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/diagnostico_windows.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
