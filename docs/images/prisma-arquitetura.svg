<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 715" role="img" aria-labelledby="title desc">
  <title id="title">PRISMA — arquitetura do sistema de medição</title>
  <desc id="desc">Fluxo conceitual: seis grandezas elétricas já isoladas e condicionadas, interface AFE-LV A0, DEMOEM MCF51EM256 e aplicativo PRISMA; gateway ESP32-S3 e IoT planejados. Linhas sólidas indicam aquisição serial de três canais já validada; linhas tracejadas indicam integração pendente.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#081426"/><stop offset=".52" stop-color="#0b1e35"/><stop offset="1" stop-color="#101b35"/></linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#15c4ce"/><stop offset="1" stop-color="#6c8bff"/></linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d5b65"/><stop offset="1" stop-color="#0b3547"/></linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3c455a"/><stop offset="1" stop-color="#111d30"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="13" flood-opacity=".3"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#c1dcff" stroke-width=".7" opacity=".07"/></pattern>
    <marker id="tip" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" stroke="#56d9dc" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="tip2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" stroke="#9aafff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .title{fill:#f5f8ff;font-weight:800}
      .sub{fill:#b8cbde}
      .body{fill:#dceaf5}
      .muted{fill:#9bb2c8}
      .tiny{font-size:16px}
      .box{fill:#102640;stroke:#345873;stroke-width:1.5}
      .planned{stroke:#7e99cd;stroke-width:4;stroke-dasharray:10 10;fill:none;marker-end:url(#tip2)}
      .valid{stroke:#40dbd0;stroke-width:4;fill:none;marker-end:url(#tip)}
      .status{fill:#162d44}
    </style>
  </defs>
  <rect width="1600" height="715" rx="26" fill="url(#bg)"/>
  <rect width="1600" height="715" rx="26" fill="url(#grid)"/>
  <g transform="translate(50 42)">
    <path d="M0 35L20 9L41 35L60 10" fill="none" stroke="#2dd4bf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 10L77 35" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
    <text x="100" y="39" font-size="48" class="title" letter-spacing="2">PRISMA</text>
    <rect x="320" y="4" width="2" height="42" fill="#4d7b9c"/>
    <text x="350" y="27" font-size="26" class="title" font-weight="650">Arquitetura de aquisição e análise de energia</text>
    <text x="350" y="56" font-size="19" class="sub">DEMOEM / ColdFire MCF51EM256 · interface AFE-LV A0 · comunicação e visualização</text>
  </g>
  <path d="M50 123H1550" stroke="#31526b" stroke-width="1.5" opacity=".8"/>

