    <circle cx="14" cy="14" r="5" fill="#b9dfde"/><circle cx="169" cy="14" r="5" fill="#b9dfde"/>
    <circle cx="14" cy="102" r="5" fill="#b9dfde"/><circle cx="169" cy="102" r="5" fill="#b9dfde"/>
