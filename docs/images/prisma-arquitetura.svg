    <g fill="#d1f6e6"><circle cx="30" cy="37" r="3"/><circle cx="30" cy="47" r="3"/><circle cx="30" cy="57" r="3"/><circle cx="30" cy="67" r="3"/><circle cx="30" cy="77" r="3"/>
    <circle cx="153" cy="37" r="3"/><circle cx="153" cy="47" r="3"/><circle cx="153" cy="57" r="3"/><circle cx="153" cy="67" r="3"/><circle cx="153" cy="77" r="3"/></g>
    <g stroke="#53d8c7" stroke-width="2" fill="none"><path d="M42 37H80V25H118V37H142"/><path d="M42 47H71V55H117V47H142"/><path d="M42 67H83V87H118V67H142"/><path d="M42 77H65V96H125V77H142"/></g>
