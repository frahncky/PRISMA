  <text x="1346" y="547" font-size="20" class="title">Tela e nuvem</text>
  <text x="1346" y="570" font-size="16" class="body">Monitoramento web</text>
  <text x="1257" y="605" font-size="15" fill="#b2c5ff">Integração física ainda pendente</text>

