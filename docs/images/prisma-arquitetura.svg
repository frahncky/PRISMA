    <rect x="342" y="164" width="280" height="319" rx="18" fill="#102640" stroke="#2bbac6" stroke-width="1.5"/>
    <rect x="675" y="164" width="335" height="319" rx="18" fill="#102640" stroke="#58a5d7" stroke-width="1.5"/>
    <rect class="box" x="1068" y="164" width="472" height="319" rx="18"/>
