  <rect x="901" y="504" width="272" height="122" rx="17" class="box"/>
  <rect x="923" y="525" width="58" height="58" rx="8" fill="#24375b" stroke="#879bce"/>
  <rect x="937" y="537" width="30" height="32" rx="4" fill="#18253d" stroke="#a9bfe5"/>
  <text x="997" y="542" font-size="21" class="title">ESP32-S3</text>
  <text x="997" y="567" font-size="16" class="body">Gateway Wi-Fi / IoT</text>
  <text x="923" y="605" font-size="15" fill="#b2c5ff">Código publicado · teste físico pendente</text>
  <path d="M1175 567H1231" class="planned"/>
  <rect x="1234" y="504" width="305" height="122" rx="17" class="box"/>
  <g transform="translate(1257 526)" stroke="#83bbff" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M6 34H57Q75 32 72 16Q69 -2 50 5Q39 -10 23 1Q16 7 16 15Q0 11 0 27Q1 34 6 34Z"/>
    <path d="M21 44L48 44"/><path d="M35 38V50"/>
