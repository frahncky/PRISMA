      <rect x="50" y="7" width="123" height="5" rx="2"/><rect x="50" y="107" width="123" height="5" rx="2"/>
    </g>
    <rect x="5" y="5" width="12" height="12" rx="2" fill="#5c768f"/>
    <rect x="203" y="101" width="12" height="12" rx="2" fill="#5c768f"/>
  </g>
  <text x="842" y="416" text-anchor="middle" font-size="17" class="body">Aquisição · firmware · UART</text>
  <rect x="699" y="435" width="286" height="30" rx="15" fill="#164b44"/>
  <circle cx="721" cy="450" r="5" fill="#38ddaf"/>
  <text x="844" y="456" text-anchor="middle" fill="#bcf7e6" font-size="15" font-weight="700">3 canais: bancada validada</text>

  <!-- Desktop -->
  <rect x="1068" y="164" width="472" height="55" rx="18" fill="#203d65"/>
  <rect x="1068" y="197" width="472" height="22" fill="#203d65"/>
