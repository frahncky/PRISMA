; PRISMA gateway — ESP32-S3 DevKitC-1 (referência).
; Ajuste board e PRISMA_UART_RX_GPIO ao modelo físico do seu módulo.
; A porta USB nativa deve suportar CDC; USB CDC encaminha apenas JSON.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PRISMA_UART_RX_GPIO=18
    -D PRISMA_VBAT_ADC_GPIO=-1
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    knolleary/PubSubClient @ ^2.8
