; PRISMA gateway — ESP32-S3 DevKitC-1 (referência).
; Ajuste board e os pinos PRISMA_UART_RX_GPIO/TX_GPIO ao modelo físico do seu módulo.
; TX_GPIO = -1 deixa o gateway só recebendo (sem comandos nem atualização da DEMOEM).
; A USB nativa (CDC) é a ponte transparente com o PRISMA no PC, nos dois sentidos.
[env:esp32s3]
platform = espressif32 @ 8.0.0  ; Arduino-ESP32 3.3 (validado com pio run)
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D PRISMA_UART_RX_GPIO=18
    -D PRISMA_UART_TX_GPIO=17
    -D PRISMA_VBAT_ADC_GPIO=-1
build_src_flags = -Wall -Wextra
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.2
    knolleary/PubSubClient @ ^2.8
