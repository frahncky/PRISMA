[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma-instrumentacao"
version = "0.2.0"
description = "PRISMA - Plataforma de Registro, Instrumentação, Sinais, Medição e Análise"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - no license granted"}
authors = [{name = "PRISMA contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "PySide6>=6.7,<7",
  "pyqtgraph>=0.13.5,<0.15",
  "pyserial>=3.5,<4",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
prisma = "prisma.main:main"
[project.entry-points."prisma.protocols"]
csv-trifasico-v1 = "prisma.plugins.csv_protocol:parse_message"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
