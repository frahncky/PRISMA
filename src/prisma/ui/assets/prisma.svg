<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f52"/>
      <stop offset="1" stop-color="#0a1222"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9c9f2"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#3ec6e0" stroke-opacity="0.25" stroke-width="3"/>
  <!-- três fases saindo do prisma -->
  <g fill="none" stroke-width="18" stroke-linecap="round">
    <path d="M140 112 L222 80" stroke="#3ec6e0"/>
    <path d="M148 140 L226 140" stroke="#f2b84b"/>
    <path d="M140 168 L222 200" stroke="#e27eaf"/>
  </g>
  <!-- feixe de entrada -->
  <path d="M34 156 L92 146" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  <!-- prisma: face clara e face sombreada -->
  <path d="M60 204 L120 50 L180 204 Z" fill="url(#face)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <path d="M120 50 L180 204 L120 204 Z" fill="#7f97dc" fill-opacity="0.55"/>
